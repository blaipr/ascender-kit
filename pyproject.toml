[build-system]
requires = ["setuptools>=84.0.0", "setuptools_scm[toml]>=10.2.3"]
build-backend = "setuptools.build_meta"

# Version handling lives in setup.py: a VERSION file wins when present, and
# setuptools_scm derives the version from git tags otherwise. Deliberately no
# [tool.setuptools_scm] section here, so the VERSION file override keeps working.

[project]
name = "ascender-kit"
description = "The official command line interface for Ascender Automation"
readme = "README.md"
# Two entries rather than one: a combined { name, email } renders as a single
# "Author-email: Ascender Project Contributors <info@ctrliq.com>" header, where
# setup.py produced separate Author and Author-email fields. This keeps the
# metadata identical.
authors = [{ name = "Ascender Project Contributors" }, { email = "info@ctrliq.com" }]
# SPDX expression rather than a "License :: OSI Approved ::" classifier, which
# setuptools deprecated and warns about on every build.
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# Supplied by setup.py, see the note above.
dynamic = ["version"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Software Distribution",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    # packaging backs ascenderkit.ascender.version_cmp, which __init__ imports
    # unconditionally, so it is needed for `import ascenderkit`.
    "packaging",
    "PyYAML",
    "requests",
    # Imported directly by the CLI to silence insecure-request warnings. It
    # arrives with requests today, but relying on that is fragile.
    "urllib3",
]

[project.optional-dependencies]
formatting = ["jq"]
websockets = ["websocket-client>=1.0.0"]
crypto = ["cryptography"]
# ascenderkit/cli/sphinx.py is a Sphinx extension shipped inside the package,
# and it imports all three. docutils arrives with sphinx today, but sphinx.py
# imports it by name, so it is declared rather than relied on as a transitive.
docs = ["sphinx", "sphinxcontrib-autoprogram", "docutils"]

[project.urls]
Homepage = "https://ascender-automation.org"
Source = "https://github.com/ctrliq/ascender-kit"
Issues = "https://github.com/ctrliq/ascender-kit/issues"

[project.scripts]
ascender = "ascenderkit.cli:run"
ascender-shell = "ascenderkit.scripts.basic_session:load_interactive"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
exclude = ["tests*"]

[tool.ruff]
# Ported from the [flake8] block in tox.ini rather than adopted from elsewhere:
# the selection below is the same 16 rules that block chose, verified one by one
# against what Ruff implements.
line-length = 160
exclude = [".git", "__pycache__", ".tox", "build", "dist", "env", "venv"]

# Matches python_requires in setup.py. Left unset, Ruff assumes py39, which is
# three releases below the floor this package declares. It is not only a lint
# setting: the formatter reads it too, so an unset value means both halves are
# targeting a Python nobody runs this on.
target-version = "py311"

[tool.ruff.format]
# The one setting black was configured with beyond the line length: preserving
# quotes rather than normalising them, which is skip-string-normalization.
quote-style = "preserve"

[tool.ruff.lint]
# E265 and E266 are preview rules in Ruff 0.16. Without this they are accepted
# and then silently do nothing, which Ruff reports on stderr as "Selection
# `E265` has no effect because preview is not enabled". The selection below is
# explicit, so preview pulls in nothing unasked for: it only makes those two
# run. Drop this once they are stabilised.
preview = true

select = [
    "E265", "E266", "E722",
    "F401", "F402", "F405", "F523", "F541", "F632",
    "F811", "F821", "F822", "F823", "F841",
    "W291", "W605",
]

[tool.pytest.ini_options]
# Moved here from a [pytest] section in tox.ini. pytest reads both, and this is
# the file the rest of the tooling configuration already lives in.
addopts = "-v --tb=native"
junit_family = "xunit2"
testpaths = ["tests/unit"]
markers = [
    "integration: needs a running Ascender; selected by pointing CONTROLLER_HOST at one",
]
