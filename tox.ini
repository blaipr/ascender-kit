[tox]
envlist =
    lint,
    test
skip_missing_interpreters = true

[testenv]
deps =
    websocket-client
    coverage
    pytest
    pytest-mock

commands = coverage run --parallel --source ascenderkit -m pytest --junit-xml=report.xml {posargs:tests/unit}

[testenv:lint]
# Formatting and linting both come from ruff. Its configuration lives in
# pyproject.toml under [tool.ruff], and the rule selection there is the one
# ported from the [flake8] block this replaces, all 16 of them. Pinned so
# results do not drift as new releases land.
deps =
    ruff==0.16.6
commands =
    ruff format --check ascenderkit tests setup.py
    ruff check ascenderkit
    - coverage erase

[testenv:docs]
# Builds the documentation with warnings as errors, which is what makes this
# worth running: a dead cross-reference or malformed directive fails here rather
# than rendering wrong. reference.rst is dropped unless CONTROLLER_HOST is set,
# because that page is generated from a live server; see the comment in
# docs/source/conf.py. Pass the credentials through to build it too.
deps =
    .[docs]
passenv =
    CONTROLLER_HOST
    CONTROLLER_USERNAME
    CONTROLLER_PASSWORD
    TOWER_HOST
    TOWER_USERNAME
    TOWER_PASSWORD
commands =
    sphinx-build -b html -W --keep-going ascenderkit/cli/docs/source {envtmpdir}/html

[testenv:typecheck]
# Advisory: the type checker runs over ascenderkit and reports what it finds
# without failing the merge, so the diagnostics already in the tree can be
# worked through a module at a time. It resolves third-party imports out of the
# environment the package is installed in; set TYPECHECK_PYTHON to point it at
# one. Pinned like the other linters so results do not drift.
deps =
    {[testenv]deps}
    ty==0.0.74
passenv =
    TYPECHECK_PYTHON
commands =
    ty check ascenderkit --python {env:TYPECHECK_PYTHON:{envdir}}
